<style>

<body>

<header>
  <h1>🧠 Aom Math Solver Pro</h1>
  <p>ระบบแก้วิธีทำและเฉลยโจทย์คณิตศาสตร์แบบจับมือทำ (100% Offline Standalone Engine)</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="panel-header">
      <h2>📝 กรอกโจทย์คณิตศาสตร์</h2>
      <div class="nav-links">
        <a href="information.html" class="btn-nav">📋 ข้อมูลส่วนตัว</a>
        <a href="index.html" class="btn-nav">🏠 หน้าแรก</a>
      </div>
    </div>

    <textarea id="problem" placeholder="ป้อนโจทย์ที่ต้องการคำนวณหรือโจทย์ปัญหา เช่น:
• โจทย์ปัญหาภาษาไทย: มีเงิน 500 บาท ซื้อของไป 120 บาท เหลือเงินกี่บาท
• คิดเลข/วงเล็บ: (5÷11)-(2-7) หรือ (25 + 15) * 4 / 2
• แฟกทอเรียล: 6!
• เลขยกกำลัง: 3^4
• สมการเชิงเส้น: 4x + 20 = 100
• สมการกำลังสอง: x^2 - 7x + 12 = 0
• ดิฟแคลคูลัส: diff(2x^3 + 5x, x)"></textarea>
    
    <div class="row">
      <button class="btn-primary" onclick="solveDetail()">วิเคราะห์และแก้โจทย์แบบจับมือทำ</button>
      <button class="btn-clear" onclick="clearAll()">ล้างข้อมูล</button>
    </div>
  </div>

  <div class="panel">
    <h2>💡 คำตอบและขั้นตอนการทำอย่างละเอียด (Qanda Style)</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
function parseThaiTextToMath(text) {
  let s = text.trim();
  const replacements = [
    { text: 'บวก', op: '+' },
    { text: 'ลบ', op: '-' },
    { text: 'คูณ', op: '*' },
    { text: 'หาร', op: '/' },
    { text: 'เท่ากับ', op: '=' },
    { text: 'ยกกำลัง', op: '^' },
    { text: '×', op: '*' },
    { text: '÷', op: '/' }
  ];
  replacements.forEach(r => {
    s = s.split(r.text).join(r.op);
  });
  return s;
}

function cleanExprString(expr) {
  return expr.replace(/\-\-/g, '+')
             .replace(/\+\-/g, '-')
             .replace(/\-\+/g, '-');
}

function solveDetail() {
  const raw = document.getElementById("problem").value.trim();
  const out = document.getElementById("answer");

  if (!raw) {
    out.innerHTML = "<b style='color:#f87171;'>กรุณากรอกโจทย์คณิตศาสตร์ก่อนครับ</b>";
    return;
  }

  let html = `<span class="badge-system">⚡ Local Math Processor (ไม่ต้องใช้อินเทอร์เน็ต)</span><br>`;
  html += `<b>โจทย์ที่รับมา:</b> <code>${raw}</code><br><br>`;

  // -------------------------------------------------------------
  // ระบบวิเคราะห์โจทย์ข้อความภาษาไทย
  // -------------------------------------------------------------
  const numbersInText = raw.match(/\d+(\.\d+)?/g);
  if (raw.includes("ซื้อ") || raw.includes("เหลือ") || raw.includes("แบ่ง") || raw.includes("แจก") || raw.includes("รวม")) {
    if (numbersInText && numbersInText.length >= 2) {
      let n1 = parseFloat(numbersInText[0]);
      let n2 = parseFloat(numbersInText[1]);
      
      html += `<div class="step-card">
                <div class="step-num">📌 ขั้นที่ 1: วิเคราะห์สิ่งที่โจทย์กำหนดให้</div>
                <div class="step-desc">
                  • จำนวนแรก ($N_1$) = <b>${n1}</b><br>
                  • จำนวนที่สอง ($N_2$) = <b>${n2}</b>
                </div>
              </div>`;

      if (raw.includes("เหลือ") || raw.includes("ซื้อ") || raw.includes("ใช้ไป")) {
        let ans = n1 - n2;
        html += `<div class="step-card">
                  <div class="step-num">📌 ขั้นที่ 2: เลือกตัวดำเนินการคณิตศาสตร์</div>
                  <div class="step-desc">โจทย์ถามหาจำนวนที่ <b>"เหลืออยู่"</b> หรือ <b>"ลดลง"</b> จึงใช้การ <b>"ลบ (-)"</b></div>
                </div>`;
        html += `<div class="step-card">
                  <div class="step-num">📌 ขั้นที่ 3: แสดงวิธีคิดประโยคสัญลักษณ์</div>
                  <div class="step-desc">
                    $$${n1} - ${n2} = ?$$
                    <div class="scratchpad">✏️ สมุดทด: ${n1} - ${n2} = ${ans}</div>
                  </div>
                </div>`;
        html += `<div class="highlight-res">สรุปคำตอบสุดท้าย: ${ans}</div>`;
        out.innerHTML = html;
        renderMath();
        return;
      } else if (raw.includes("รวม") || raw.includes("ทั้งหมด")) {
        let ans = n1 + n2;
        html += `<div class="step-card">
                  <div class="step-num">📌 ขั้นที่ 2: เลือกตัวดำเนินการคณิตศาสตร์</div>
                  <div class="step-desc">โจทย์ถามหาจำนวน <b>"รวมทั้งหมด"</b> จึงใช้การ <b>"บวก (+)"</b></div>
                </div>`;
        html += `<div class="step-card">
                  <div class="step-num">📌 ขั้นที่ 3: แสดงวิธีคิดประโยคสัญลักษณ์</div>
                  <div class="step-desc">
                    $$${n1} + ${n2} = ?$$
                    <div class="scratchpad">✏️ สมุดทด: ${n1} + ${n2} = ${ans}</div>
                  </div>
                </div>`;
        html += `<div class="highlight-res">สรุปคำตอบสุดท้าย: ${ans}</div>`;
        out.innerHTML = html;
        renderMath();
        return;
      }
    }
  }

  const cleaned = parseThaiTextToMath(raw);

  // -------------------------------------------------------------
  // 1. แฟกทอเรียล (Factorial)
  // -------------------------------------------------------------
  const factMatch = cleaned.match(/^(\d+)!$/);
  if (factMatch) {
    const num = parseInt(factMatch[1]);
    html += `<b>📌 นิยาม Factorial ($n!$):</b> ผลคูณของจำนวนเต็มบวกตั้งแต่ $n$ ลดลงทีละ 1 ถึง $1$<br>`;
    
    let expansion = [];
    for (let i = num; i >= 1; i--) expansion.push(i);
    
    html += `<div class="step-card">
              <div class="step-num">ขั้นที่ 1: แจกแจงนิพจน์การคูณ</div>
              <div class="step-desc">$$${num}! = ${expansion.join(' \\times ')}$$</div>
            </div>`;

    let currentTotal = num;
    let stepCount = 2;
    for (let i = num - 1; i >= 1; i--) {
      let prev = currentTotal;
      currentTotal = currentTotal * i;
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ ${stepCount++}: คูณสะสมทีละคู่ ($${prev} \\times ${i}$)</div>
                <div class="step-desc">
                  <div class="scratchpad">✏️ สมุดทด: ${prev} × ${i} = ${currentTotal}</div>
                </div>
              </div>`;
    }
    html += `<div class="highlight-res">สรุปคำตอบสุดท้าย: ${num}! = ${currentTotal}</div>`;
    out.innerHTML = html;
    renderMath();
    return;
  }

  // -------------------------------------------------------------
  // 2. เลขยกกำลัง
  // -------------------------------------------------------------
  const powMatch = cleaned.match(/^(\d+)\^(\d+)$/);
  if (powMatch) {
    const base = parseInt(powMatch[1]);
    const exp = parseInt(powMatch[2]);
    
    html += `<b>📌 นิยามเลขยกกำลัง ($a^b$):</b> การนำฐาน $a = ${base}$ มาคูณกันจำนวน $b = ${exp}$ ตัว<br>`;
    
    let arr = Array(exp).fill(base);
    html += `<div class="step-card">
              <div class="step-num">ขั้นที่ 1: กระจายตัวเลขการคูณ</div>
              <div class="step-desc">$$${base}^${exp} = ${arr.join(' \\times ')}$$</div>
            </div>`;

    let current = base;
    for(let i = 2; i <= exp; i++) {
      let prev = current;
      current = current * base;
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ ${i}: คูณสะสมรอบที่ ${i - 1}</div>
                <div class="step-desc">
                  <div class="scratchpad">✏️ สมุดทด: ${prev} × ${base} = ${current}</div>
                </div>
              </div>`;
    }

    html += `<div class="highlight-res">สรุปคำตอบสุดท้าย: ${base}^${exp} = ${current}</div>`;
    out.innerHTML = html;
    renderMath();
    return;
  }

  // -------------------------------------------------------------
  // 3. ดิฟแคลคูลัส
  // -------------------------------------------------------------
  if (cleaned.startsWith("diff(") || cleaned.startsWith("derivative(")) {
    try {
      const diffRes = nerdamer(cleaned);
      const innerExpr = cleaned.replace('diff(','').replace('derivative(','').replace(/\s*,\s*x\s*\)/,'');
      
      html += `<b>📌 การหาอนุพันธ์ (Calculus Derivative):</b><br>`;
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 1: ระบุสูตร Power Rule</div>
                <div class="step-desc">ใช้สูตร $\\frac{d}{dx}(x^n) = n \\cdot x^{n-1}$</div>
              </div>`;
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 2: กระจาย $\\frac{d}{dx}$ เข้าไปในแต่ละพจน์</div>
                <div class="step-desc">ดิฟแต่ละพจน์ใน $(${innerExpr})$ แยกกันตามเครื่องหมาย</div>
              </div>`;
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 3: คำนวณผลลัพธ์สุทธิ</div>
                <div class="step-desc">$$\\frac{d}{dx} \\left( ${innerExpr} \\right) = ${diffRes.toTeX()}$$</div>
              </div>`;
      html += `<div class="highlight-res">คำตอบสุดท้าย: $${diffRes.toTeX()}$</div>`;
      out.innerHTML = html;
      renderMath();
      return;
    } catch(e) {}
  }

  // -------------------------------------------------------------
  // 4. แก้สมการ (Algebra)
  // -------------------------------------------------------------
  if (cleaned.includes("=")) {
    try {
      const parts = cleaned.split("=");
      const left = parts[0].trim();
      const right = parts[1].trim();
      
      const sol = nerdamer.solve(`(${left}) - (${right})`, 'x');
      const solArr = JSON.parse(sol.toString());

      html += `<b>📌 การแก้สมการพีชคณิตเพื่อหาค่า $x$:</b> $${left} = ${right}$<br>`;
      
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 1: จัดรูปสมการให้ฝั่งขวาเท่ากับ 0</div>
                <div class="step-desc">ย้ายพจน์ $${right}$ จากขวามาซ้ายโดยเปลี่ยนเครื่องหมายเป็นตรงข้าม:<br>
                $$(${left}) - (${right}) = 0$$</div>
              </div>`;

      if (left.includes("x^2") || left.includes("x²")) {
        html += `<div class="step-card">
                  <div class="step-num">ขั้นที่ 2: ใช้สูตรสมการกำลังสอง (Quadratic Formula)</div>
                  <div class="step-desc">จากรูปทั่วไป $ax^2 + bx + c = 0$ แทนค่าในสูตร:<br>
                  $$x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$</div>
                </div>`;
      } else {
        html += `<div class="step-card">
                  <div class="step-num">ขั้นที่ 2: ย้ายพจน์ตัวเลขไปอยู่อีกฝั่ง</div>
                  <div class="step-desc">จัดกลุ่มให้ตัวแปร $x$ อยู่ซ้ายมือ และตัวเลขอยู่อยู่ขวามือ</div>
                </div>`;
        html += `<div class="step-card">
                  <div class="step-num">ขั้นที่ 3: ย้ายสัมประสิทธิ์ไปหาร</div>
                  <div class="step-desc">นำตัวเลขที่คูณกับ $x$ ย้ายไปหารอีกฝั่งเพื่อหาค่า $x$</div>
                </div>`;
      }

      html += `<div class="step-card">
                <div class="step-num">ขั้นสรุป: ได้คำตอบของสมการ</div>
                <div class="step-desc">$$x = ${solArr.join(' \\quad \\text{หรือ} \\quad ')}$$</div>
              </div>`;

      html += `<div class="highlight-res">สรุปคำตอบสุดท้าย: x = ${solArr.join(' หรือ ')}</div>`;
      out.innerHTML = html;
      renderMath();
      return;
    } catch(e) {}
  }

  // -------------------------------------------------------------
  // 5. คิดเลขทั่วไปตามหลัก PEMDAS (Safe Evaluator)
  // -------------------------------------------------------------
  try {
    let finalVal = math.evaluate(cleaned);
    let numericRes = typeof finalVal === 'number' ? finalVal : math.number(finalVal);

    html += `<b>📌 การคำนวณตามหลักลำดับความสำคัญ (PEMDAS):</b><br>`;

    let stepNum = 1;
    let expr = cleaned;

    // ถอดวงเล็บ
    while (expr.includes('(')) {
      let inside = expr.match(/\(([^()]+)\)/);
      if (inside) {
        let innerStr = inside[1];
        let inVal = math.evaluate(innerStr);
        let numericInVal = typeof inVal === 'number' ? inVal : math.number(inVal);
        
        let displayVal = Number.isInteger(numericInVal) ? numericInVal : parseFloat(numericInVal.toFixed(4));
        if (numericInVal < 0) {
          displayVal = `(${numericInVal})`;
        }

        expr = cleanExprString(expr.replace(inside[0], displayVal));

        html += `<div class="step-card">
                  <div class="step-num">ขั้นที่ ${stepNum++}: คำนวณพจน์ในวงเล็บ $(${innerStr})$</div>
                  <div class="step-desc">
                    <div class="scratchpad">✏️ นิพจน์หลังถอดวงเล็บ: ${expr}</div>
                  </div>
                </div>`;
      } else break;
    }

    let finalFormatted = Number.isInteger(numericRes) ? numericRes : parseFloat(numericRes.toFixed(4));

    if (stepNum > 1) {
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ ${stepNum}: บวก/ลบ พจน์ทั้งหมดเข้าด้วยกัน</div>
                <div class="step-desc">
                  <div class="scratchpad">✏️ ผลลัพธ์บรรทัดสุดท้าย: ${expr} = ${finalFormatted}</div>
                </div>
              </div>`;
    } else {
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 1: คำนวณผลลัพธ์</div>
                <div class="step-desc">
                  <div class="scratchpad">✏️ สมุดทด: ${cleaned} = ${finalFormatted}</div>
                </div>
              </div>`;
    }

    html += `<div class="highlight-res">สรุปคำตอบสุดท้าย = ${finalFormatted}</div>`;
    out.innerHTML = html;
    renderMath();
    return;

  } catch(e) {
    console.error(e);
  }

  out.innerHTML = "<b style='color:#f87171;'>ไม่สามารถคำนวณโจทย์รูปแบบนี้ได้ โปรดตรวจสอบตัวเลขหรือสัญลักษณ์อีกครั้ง</b>";
}

function renderMath() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([document.getElementById("answer")]);
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>
