<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver — Offline & Universal Engine</title>

<!-- โหลด math.js สำหรับคำนวณตัวเลขและนิพจน์คณิตศาสตร์ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<!-- โหลด MathJax สำหรับแสดงผลสูตรคณิตศาสตร์สวยงาม -->
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f5f7fb;color:#18202a}
header{background:#111827;color:#fff;padding:30px 6%;text-align:center}
header h1{margin:0;font-size:clamp(28px,5vw,48px)}
header p{color:#cbd5e1;margin-top:8px}
.wrap{max-width:1000px;margin:30px auto;padding:0 18px}
.panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
textarea{width:100%;min-height:160px;border:2px solid #dbe1ea;border-radius:14px;padding:16px;font-size:18px;resize:vertical;outline:none}
textarea:focus{border-color:#4f46e5}
select,button{padding:12px 16px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
button{background:#4f46e5;color:#fff;border:0;font-weight:bold;cursor:pointer;transition:background 0.2s}
button:hover{background:#4338ca}
.btn-clear{background:#e5e7eb;color:#374151}
.btn-clear:hover{background:#d1d5db}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
#answer{white-space:pre-wrap;line-height:1.75;font-size:17px;background:#f8fafc;border-radius:14px;padding:18px;min-height:110px;border:1px solid #e2e8f0}
.note{font-size:13px;color:#64748b;margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver</h1>
  <p>Advanced Mathematics Solver — Algebra • Calculus • Arithmetic</p>
</header>

<div class="wrap">
  <div class="panel">
    <h2>โจทย์คณิตศาสตร์</h2>
    <textarea id="problem" placeholder="พิมพ์โจทย์ เช่น:
- 2 + 2
- (50 * 2) / 4
- derivative('x^2 + 3x', 'x')
- simplify('2x + 3x - 5')"></textarea>
    
    <div class="row">
      <button onclick="solve()">วิเคราะห์และแก้โจทย์</button>
      <button class="btn-clear" onclick="clearAll()">ล้าง</button>
    </div>
    <p class="note">คำนวณตัวเลข สมการ และแคลคูลัสพื้นฐานได้ทันทีผ่าน Math Engine ในเบราว์เซอร์</p>
  </div>

  <div class="panel">
    <h2>คำตอบและวิธีทำ</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
function solve() {
  const raw = document.getElementById("problem").value.trim();
  const out = document.getElementById("answer");
  
  if (!raw) {
    out.textContent = "กรุณาใส่โจทย์ก่อนครับ";
    return;
  }

  const q = raw.replace(/\s+/g, "");

  // 1. ตรวจจับสมการกำลังสอง ax^2 + bx + c = 0
  let m = q.match(/(-?\d*\.?\d*)x\^2([+-]\d*\.?\d*)x([+-]\d*\.?\d*)=0/i);
  if (m) {
    const a = m[1] === "" || m[1] === "+" ? 1 : m[1] === "-" ? -1 : Number(m[1]);
    const b = m[2] === "+" || m[2] === "" ? 1 : m[2] === "-" ? -1 : Number(m[2]);
    const c = Number(m[3]);
    const D = b * b - 4 * a * c;
    let s = `โจทย์: ${raw}\n\n1) จัดให้อยู่ในรูป ax² + bx + c = 0\n   a = ${a}, b = ${b}, c = ${c}\n\n2) หา Discriminant\n   Δ = b² − 4ac = ${D}\n\n3) ใช้สูตรกำลังสอง\n   x = (−b ± √Δ) / (2a)\n\n`;
    if (D > 0) {
      const x1 = (-b + Math.sqrt(D)) / (2 * a);
      const x2 = (-b - Math.sqrt(D)) / (2 * a);
      s += `มีรากจริง 2 ค่า\n   x₁ ≈ ${x1.toFixed(6)}\n   x₂ ≈ ${x2.toFixed(6)}`;
    } else if (D === 0) {
      s += `มีรากจริงซ้ำ\n   x = ${(-b / (2 * a)).toFixed(6)}`;
    } else {
      const re = -b / (2 * a);
      const im = Math.sqrt(-D) / (2 * a);
      s += `ไม่มีรากจริง และมีรากเชิงซ้อน\n   x₁ = ${re.toFixed(6)} + ${im.toFixed(6)}i\n   x₂ = ${re.toFixed(6)} − ${im.toFixed(6)}i`;
    }
    out.textContent = s;
    return;
  }

  // 2. หากไม่ใช่สมการกำลังสอง ให้ใช้ math.js ประมวลผลโจทย์ทั่วไป (เช่น 2+2, sin(45), simplify)
  try {
    const result = math.evaluate(raw);
    let outputText = `โจทย์: ${raw}\n\nคำตอบ:\n${result}`;

    // ถ้าแปลงเป็นรูปแบบ LaTeX ได้ จะจัดรูปให้อ่านง่ายขึ้น
    try {
      const node = math.parse(raw);
      const latex = node.toTex({ parenthesis: 'keep' });
      outputText = `นิพจน์: \\[ ${latex} \\]\n\nคำตอบ:\n\\[ ${result} \\]`;
      out.innerHTML = outputText.replace(/\n/g, '<br>');
      if (window.MathJax) MathJax.typesetPromise([out]);
      return;
    } catch (e) {
      out.textContent = outputText;
      return;
    }
  } catch (err) {
    // 3. กรณีประมวลผลไม่ได้เลย
    out.textContent = `ไม่สามารถคำนวณโจทย์นี้ได้โดยตรง\n\nโปรดตรวจสอบไวยากรณ์ เช่น:\n• ตัวเลขพื้นฐาน: 2 + 2 หรือ (10 * 5) / 2\n• ดิฟเวกเตอร์/อนุพันธ์: derivative('x^3 + 2x', 'x')\n• จัดรูปสมการ: simplify('2x + 3x')`;
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").textContent = "รอรับโจทย์...";
}
</script>

</body>
</html>
