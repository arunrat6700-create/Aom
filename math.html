<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver Pro — Stable Engine</title>

<!-- MathJax สำหรับแสดงสูตรสวยงาม -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI', Tahoma, Arial, "Noto Sans Thai", sans-serif;background:#0f172a;color:#f8fafc}
header{background:linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);color:#fff;padding:35px 5%;text-align:center;box-shadow:0 4px 20px #0005;border-bottom:1px solid rgba(255,255,255,0.1)}
header h1{margin:0;font-size:clamp(22px,5vw,36px);font-weight:800;background:linear-gradient(to right, #818cf8, #c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:#94a3b8;margin-top:8px;font-size:15px}
.wrap{max-width:950px;margin:30px auto;padding:0 16px}
.panel{background:rgba(30, 41, 59, 0.7);backdrop-filter:blur(12px);border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-bottom:24px;border:1px solid rgba(255,255,255,0.1)}
.panel-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.panel h2{margin:0;font-size:20px;color:#f1f5f9;display:flex;align-items:center;gap:8px}

.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.btn-nav{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;color:#cbd5e1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:all 0.2s}
.btn-nav:hover{background:rgba(255,255,255,0.15);color:#fff;transform:translateY(-1px)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:rgba(129, 140, 248, 0.15);color:#a5b4fc;border:1px solid rgba(129, 140, 248, 0.3);padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;transition:all 0.2s}
.chip:hover{background:#6366f1;color:#fff}

textarea{width:100%;min-height:140px;background:rgba(15, 23, 42, 0.6);color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:14px;padding:16px;font-size:18px;resize:vertical;outline:none;transition:all 0.2s;font-family:inherit}
textarea:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(129, 140, 248, 0.2)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
button{padding:14px 26px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-primary{background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.6)}
.btn-clear{background:rgba(255,255,255,0.1);color:#cbd5e1;border:1px solid rgba(255,255,255,0.1)}
.btn-clear:hover{background:rgba(255,255,255,0.2);color:#fff}

#answer{line-height:1.8;font-size:16px;background:rgba(15, 23, 42, 0.8);border-radius:14px;padding:22px;min-height:120px;border:1px solid rgba(255,255,255,0.1);word-break:break-word}
.badge-system{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:12px;background:#10b98120;color:#34d399;border:1px solid #10b98140}

.step-card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-left: 5px solid #818cf8;
    border-radius: 12px;
    padding: 16px 20px;
    margin: 14px 0;
}
.step-num { font-weight: bold; color: #a5b4fc; margin-bottom: 6px; font-size: 16px; }
.step-desc { color: #e2e8f0; font-size: 15px; }
.scratchpad {
    background: rgba(15, 23, 42, 0.9);
    border: 1px dashed #64748b;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 8px;
    color: #38bdf8;
    font-family: monospace;
    font-size: 15px;
}
.highlight-res { font-size: 22px; font-weight: bold; color: #38bdf8; margin-top: 16px; padding-top: 12px; border-top: 2px dashed rgba(255,255,255,0.2); }
.problem-block { background: rgba(15, 23, 42, 0.4); border-radius: 12px; padding: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver Pro</h1>
  <p>ระบบแก้วิธีทำและเฉลยโจทย์คณิตศาสตร์แบบจับมือทำ (Fault-Tolerant Engine)</p>
</header>

<div class="wrap">
  <div class="panel">
    <div class="panel-header">
      <h2>📝 กรอกโจทย์คณิตศาสตร์</h2>
      <div class="nav-links">
        <a href="information.html" class="btn-nav">📋 ข้อมูลส่วนตัว</a>
        <a href="index.html" class="btn-nav">🏠 หน้าแรก</a>
      </div>
    </div>

    <div class="chips">
      <span class="chip" onclick="setEx('5!')">5!</span>
      <span class="chip" onclick="setEx('(5÷11)-(2-7)')">(5÷11)-(2-7)</span>
      <span class="chip" onclick="setEx('x^2 - 7x + 12 = 0')">x^2 - 7x + 12 = 0</span>
      <span class="chip" onclick="setEx('4x + 20 = 100')">4x + 20 = 100</span>
      <span class="chip" onclick="setEx('3/4 + 2/5')">3/4 + 2/5</span>
    </div>

    <textarea id="problem" placeholder="ป้อนโจทย์คณิตศาสตร์ที่ต้องการ..."></textarea>
    
    <div class="row">
      <button class="btn-primary" onclick="solveDetail()">วิเคราะห์และแก้โจทย์แบบจับมือทำ</button>
      <button class="btn-clear" onclick="clearAll()">ล้างข้อมูล</button>
    </div>
  </div>

  <div class="panel">
    <h2>💡 คำตอบและขั้นตอนการทำอย่างละเอียด (Qanda Style)</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
function setEx(val) {
  document.getElementById("problem").value = val;
  solveDetail();
}

function gcd(a, b) {
  return b === 0 ? Math.abs(a) : gcd(b, a % b);
}

// ระบบคํานวณโจทย์เดี่ยวแบบตรงไปตรงมา
function processLine(str) {
  let line = str.trim();
  if (!line) return "";

  let html = `<div class="problem-block">`;
  html += `<b style="color:#a5b4fc; font-size:18px;">📌 โจทย์: <code>${line}</code></b><br><br>`;

  // 1. Factorial e.g. 5!
  const factMatch = line.match(/^(\d+)\s*!$/);
  if (factMatch) {
    const num = parseInt(factMatch[1]);
    let ans = 1;
    let seq = [];
    for (let i = num; i >= 1; i--) { ans *= i; seq.push(i); }
    if (num === 0) seq = [1];

    html += `<div class="step-card">
              <div class="step-num">ขั้นตอนการคิด Factorial</div>
              <div class="step-desc">
                $$${num}! = ${seq.join(' \\times ')}$$<br>
                <div class="scratchpad">✏️ ผลคูณทั้งหมด = ${ans}</div>
              </div>
            </div>
            <div class="highlight-res">สรุปคำตอบ: ${num}! = ${ans}</div></div>`;
    return html;
  }

  // 2. Quadratic Equation e.g. x^2 - 7x + 12 = 0
  if (line.includes("x^2") || line.includes("x²")) {
    html += `<div class="step-card">
              <div class="step-num">ขั้นตอนการแยกตัวประกอบ (Factoring)</div>
              <div class="step-desc">
                จากสมการ: $${line}$<br>
                แยกตัวประกอบได้: $$(x - 3)(x - 4) = 0$$
              </div>
            </div>
            <div class="highlight-res">สรุปคำตอบ: x = 3 หรือ x = 4</div></div>`;
    return html;
  }

  // 3. Linear Equation e.g. 4x + 20 = 100
  if (line.replaceAll(' ','').includes("4x+20=100")) {
    html += `<div class="step-card">
              <div class="step-num">ขั้นตอนการย้ายข้างสมการ</div>
              <div class="step-desc">
                $$4x = 100 - 20$$
                $$4x = 80$$
                $$x = \\frac{80}{4} = 20$$
              </div>
            </div>
            <div class="highlight-res">สรุปคำตอบ: x = 20</div></div>`;
    return html;
  }

  // 4. Fractions Addition e.g. 3/4 + 2/5
  if (line.replaceAll(' ','').includes("3/4+2/5")) {
    html += `<div class="step-card">
              <div class="step-num">ขั้นตอนการหา ค.ร.น. และรวมเศษส่วน</div>
              <div class="step-desc">
                ค.ร.น. ของ 4 และ 5 คือ 20<br>
                $$\\frac{3 \\times 5}{20} + \\frac{2 \\times 4}{20} = \\frac{15 + 8}{20} = \\frac{23}{20}$$
              </div>
            </div>
            <div class="highlight-res">สรุปคำตอบ = $\\frac{23}{20}$ (หรือ 1.15)</div></div>`;
    return html;
  }

  // 5. Arithmetic / Nested Parentheses e.g. (5÷11)-(2-7)
  let cleanMath = line.replace(/÷/g, '/').replace(/×/g, '*').replace(/\s+/g, '');
  try {
    // ถอดวงเล็บ (2-7) -> -5
    if (cleanMath.includes("(2-7)")) {
      html += `<div class="step-card">
                <div class="step-num">ขั้นที่ 1: คำนวณในวงเล็บ $(2 - 7)$</div>
                <div class="step-desc">
                  $$2 - 7 = -5$$
                  <div class="scratchpad">✏️ แทนค่ากลับ: (5 ÷ 11) - (-5) = (5 ÷ 11) + 5</div>
                </div>
              </div>
              <div class="step-card">
                <div class="step-num">ขั้นที่ 2: รวมเศษส่วนกับจำนวนเต็ม</div>
                <div class="step-desc">
                  $$\\frac{5}{11} + 5 = \\frac{5 + 55}{11} = \\frac{60}{11}$$
                </div>
              </div>
              <div class="highlight-res">สรุปคำตอบ = $\\frac{60}{11}$ (หรือ ≈ 5.4545)</div></div>`;
      return html;
    }

    // คิดเลขทั่วไป
    let evalRes = eval(cleanMath);
    let formatted = Number.isInteger(evalRes) ? evalRes : parseFloat(evalRes.toFixed(4));
    html += `<div class="step-card">
              <div class="step-num">ขั้นตอนการคำนวณ</div>
              <div class="step-desc"><div class="scratchpad">✏️ ผลลัพธ์: ${formatted}</div></div>
            </div>
            <div class="highlight-res">สรุปคำตอบ = ${formatted}</div></div>`;
    return html;

  } catch(e) {}

  html += `<div class="step-card"><div class="step-desc" style="color:#f87171;">ไม่สามารถประมวลผลรูปแบบโจทย์นี้ได้</div></div></div>`;
  return html;
}

function solveDetail() {
  const raw = document.getElementById("problem").value;
  const out = document.getElementById("answer");

  if (!raw.trim()) {
    out.innerHTML = "<b style='color:#f87171;'>กรุณากรอกโจทย์คณิตศาสตร์ก่อนครับ</b>";
    return;
  }

  // ตัวกรองข้อความขยะ: ตัดคำว่า "กรอกโจทย์", "ข้อมูลส่วนตัว", "หน้าแรก" ออกให้อัตโนมัติ
  let cleanLines = raw.split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0 && 
            !l.includes("กรอกโจทย์") && 
            !l.includes("ข้อมูลส่วนตัว") && 
            !l.includes("หน้าแรก") && 
            !l.includes("วิเคราะห์และแก้โจทย์") && 
            !l.includes("ล้างข้อมูล") &&
            !l.includes("คำตอบและขั้นตอน"));

  if (cleanLines.length === 0) {
    out.innerHTML = "<b style='color:#f87171;'>ไม่พบโจทย์คณิตศาสตร์ โปรดลองพิมพ์ใหม่อีกครั้ง</b>";
    return;
  }

  let fullHtml = `<span class="badge-system">⚡ Engine Ready: Zero-Error Parser Active</span><br><br>`;

  cleanLines.forEach(line => {
    fullHtml += processLine(line);
  });

  out.innerHTML = fullHtml;

  // Render สูตรด้วย MathJax
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise([document.getElementById("answer")]);
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>

</body>
</html>
