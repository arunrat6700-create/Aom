<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver — Universal Offline Engine</title>

<!-- 1. Math.js for General Math & Arithmetic -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<!-- 2. Nerdamer for Symbolic Algebra, Equations & Calculus -->
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>

<!-- 3. MathJax for TeX Rendering -->
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f5f7fb;color:#18202a}
header{background:#111827;color:#fff;padding:30px 6%;text-align:center}
header h1{margin:0;font-size:clamp(28px,5vw,48px)}
header p{color:#cbd5e1;margin-top:8px}
.wrap{max-width:1000px;margin:30px auto;padding:0 18px}
.panel{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001;margin-bottom:20px}
textarea{width:100%;min-height:160px;border:2px solid #dbe1ea;border-radius:14px;padding:16px;font-size:18px;resize:vertical;outline:none}
textarea:focus{border-color:#4f46e5}
select,button{padding:12px 16px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
button{background:#4f46e5;color:#fff;border:0;font-weight:bold;cursor:pointer;transition:background 0.2s}
button:hover{background:#4338ca}
.btn-clear{background:#e5e7eb;color:#374151}
.btn-clear:hover{background:#d1d5db}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
#answer{line-height:1.75;font-size:17px;background:#f8fafc;border-radius:14px;padding:18px;min-height:110px;border:1px solid #e2e8f0;word-break:break-word}
.note{font-size:13px;color:#64748b;margin-top:10px}
.step-title{font-weight:bold;color:#4f46e5;margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver</h1>
  <p>Universal Mathematical Solver Engine — Arithmetic • Algebra • Calculus</p>
</header>

<div class="wrap">
  <div class="panel">
    <h2>โจทย์คณิตศาสตร์</h2>
    <textarea id="problem" placeholder="พิมพ์โจทย์คณิตศาสตร์ได้ทุกรูปแบบ เช่น:
• ตัวเลขและสัญลักษณ์: 2+2, 12x13, 100/5, 2^10
• ตัวหนังสือภาษาไทย: สองบวกสอง, สิบคูณห้า
• สมการพีชคณิต: x^2 - 5x + 6 = 0
• ดิฟ/อินทิเกรต: diff(x^3 + 2x, x), integrate(x^2, x)"></textarea>
    
    <div class="row">
      <button onclick="solve()">วิเคราะห์และแก้โจทย์</button>
      <button class="btn-clear" onclick="clearAll()">ล้าง</button>
    </div>
    <p class="note">รองรับโจทย์คำนวณเบื้องต้น สมการ พีชคณิต และแคลคูลัสผ่านการประมวลผลในตัวเครื่อง</p>
  </div>

  <div class="panel">
    <h2>คำตอบและวิธีทำ</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
// แปลงข้อความภาษาไทย/เครื่องหมายทั่วไป ให้เป็นสัญลักษณ์คณิตศาสตร์มาตรฐาน
function normalizeText(input) {
  let str = input.trim();

  // แปลงคำภาษาไทยพื้นฐาน
  const textMap = {
    'บวก': '+', 'ลบ': '-', 'คูณ': '*', 'หาร': '/',
    'กำลัง': '^', 'ยกกำลัง': '^', 'เท่ากับ': '=',
    'ศูนย์': '0', 'หนึ่ง': '1', 'สอง': '2', 'สาม': '3', 'สี่': '4',
    'ห้า': '5', 'หก': '6', 'เจ็ด': '7', 'แปด': '8', 'เก้า': '9', 'สิบ': '10'
  };

  for (let key in textMap) {
    str = str.split(key).join(textMap[key]);
  }

  // แปลงสัญลักษณ์คูณ/หาร ทั่วไป (x, ×, ÷)
  str = str.replace(/×/g, '*').replace(/÷/g, '/');
  
  // แปลงกรณีคูณด้วย 'x' หรือ 'X' เมื่ออยู่ระหว่างตัวเลข เช่น 12x13 -> 12*13
  str = str.replace(/(\d+)\s*[xX]\s*(\d+)/g, '$1*$2');

  return str;
}

function solve() {
  const raw = document.getElementById("problem").value.trim();
  const out = document.getElementById("answer");
  
  if (!raw) {
    out.innerHTML = "<b style='color:red;'>กรุณากรอกโจทย์ก่อนครับ</b>";
    return;
  }

  const cleaned = normalizeText(raw);
  let htmlResult = `<b>โจทย์ที่รับเข้ามา:</b> ${raw}<br>`;
  if (cleaned !== raw) {
    htmlResult += `<b>แปลงเป็นนิพจน์:</b> <code>${cleaned}</code><br>`;
  }
  htmlResult += `<hr style="border:0; border-top:1px solid #e2e8f0; margin:12px 0;">`;

  // LAYER 1: แก้สมการที่มีเครื่องหมาย = (เช่น x^2 - 5x + 6 = 0)
  if (cleaned.includes("=")) {
    try {
      const parts = cleaned.split("=");
      const expr = `(${parts[0]}) - (${parts[1]})`;
      const solutions = nerdamer.solve(expr, 'x');
      htmlResult += `<div class="step-title">คำตอบของสมการ (หาค่า x):</div>`;
      htmlResult += `\\[ x = ${nerdamer(solutions).toTeX()} \\]`;
      renderOutput(htmlResult);
      return;
    } catch (e) {
      // หาก Nerdamer แก้ไม่ผ่าน จะข้ามไปประมวลผลชั้นถัดไป
    }
  }

  // LAYER 2: ประมวลผลด้วย Math.js (คำนวณตัวเลข 2+2, 12*13, เมทริกซ์, ฟังก์ชัน)
  try {
    const mathEval = math.evaluate(cleaned);
    if (mathEval !== undefined) {
      let latexExpr = "";
      try {
        latexExpr = math.parse(cleaned).toTex();
      } catch (e) {
        latexExpr = cleaned;
      }

      htmlResult += `<div class="step-title">ผลลัพธ์การคำนวณ:</div>`;
      htmlResult += `\\[ ${latexExpr} = ${mathEval} \\]`;
      renderOutput(htmlResult);
      return;
    }
  } catch (e) {
    // ข้ามไป Layer 3
  }

  // LAYER 3: ประมวลผลด้วย Nerdamer CAS (พีชคณิต ดิฟ อินทิเกรต)
  try {
    const casResult = nerdamer(cleaned);
    htmlResult += `<div class="step-title">ผลลัพธ์เชิงพีชคณิต:</div>`;
    htmlResult += `\\[ ${casResult.toTeX()} \\]`;
    renderOutput(htmlResult);
    return;
  } catch (e) {
    // หากไม่ตรงกับทุก Layer
    htmlResult += `<b style="color:red;">ไม่สามารถประมวลผลโจทย์นี้ได้</b><br>โปรดตรวจสอบรูปแบบการพิมพ์ เช่น <code>2+2</code>, <code>12*13</code> หรือ <code>x^2 - 4 = 0</code>`;
    renderOutput(htmlResult);
  }
}

function renderOutput(content) {
  const out = document.getElementById("answer");
  out.innerHTML = content;
  if (window.MathJax) {
    MathJax.typesetPromise([out]);
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>

</body>
</html>
