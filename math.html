<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver — Universal Engine</title>

<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background:#f0f2f5;color:#1c1e21}
header{background:linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);color:#fff;padding:40px 6%;text-align:center}
header h1{margin:0;font-size:clamp(28px,5vw,44px)}
header p{color:#e0e7ff;margin-top:8px}
.wrap{max-width:900px;margin:-20px auto 40px;padding:0 16px;position:relative;z-index:10}
.panel{background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 25px rgba(0,0,0,0.08);margin-bottom:24px}
textarea{width:100%;min-height:160px;border:2px solid #e4e6eb;border-radius:12px;padding:16px;font-size:16px;outline:none;transition:border-color 0.2s}
textarea:focus{border-color:#2a5298}
select,button{padding:12px 20px;border-radius:8px;border:1px solid #ccd0d5;font-size:15px;font-weight:600}
button{background:#2a5298;color:#fff;border:0;cursor:pointer;transition:background 0.2s}
button:hover{background:#1e3c72}
.btn-clear{background:#e4e6eb;color:#4b5563}
.btn-clear:hover{background:#d8dadf}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
#answer{line-height:1.8;font-size:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:20px;min-height:120px}
.loading{color:#64748b;font-style:italic}
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver</h1>
  <p>Universal Mathematics Solver Engine</p>
</header>

<div class="wrap">
  <div class="panel">
    <h2>ป้อนโจทย์คณิตศาสตร์</h2>
    <textarea id="problem" placeholder="พิมพ์โจทย์คณิตศาสตร์ที่ต้องการ เช่น:
- Solve 2x^2 + 5x - 3 = 0
- Find \int x^2 \cos(x) dx
- Prove that \sqrt{2} is irrational"></textarea>
    
    <div class="row">
      <select id="engine">
        <option value="api">AI / CAS Cloud Engine (แก้ได้ทุกโจทย์)</option>
        <option value="local">Local Basic Rule Engine</option>
      </select>
      <button onclick="solveProblem()">แก้โจทย์</button>
      <button class="btn-clear" onclick="clearAll()">ล้างข้อมูล</button>
    </div>
  </div>

  <div class="panel">
    <h2>คำตอบและขั้นตอนการแสดงผล</h2>
    <div id="answer" class="loading">รอรับโจทย์...</div>
  </div>
</div>

<script>
async function solveProblem() {
  const input = document.getElementById("problem").value.trim();
  const engine = document.getElementById("engine").value;
  const output = document.getElementById("answer");

  if (!input) {
    output.innerHTML = "<b style='color:red;'>กรุณากรอกโจทย์ก่อนทำการวิเคราะห์</b>";
    return;
  }

  output.className = "loading";
  output.innerHTML = "กำลังประมวลผลคำตอบ...";

  if (engine === "api") {
    // โครงสร้างการส่งต่อไปยัง Backend API
    try {
      /* สำหรับการใช้งานจริง: เชื่อมต่อ Backend API ที่เรียกใช้ OpenAI / Gemini / WolframAlpha
        
        const res = await fetch('/api/solve-math', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ prompt: input })
        });
        const data = await res.json();
        renderSolution(data.solution);
      */
      
      // ตัวอย่างจำลองการตอบกลับเมื่อเรียก API
      setTimeout(() => {
        const mockResponse = `
          <b>การวิเคราะห์โจทย์ระดับสูง:</b><br>
          พิจารณาสมการ: \\[ ${input} \\]
          <br><b>ขั้นตอนการแก้ปัญหา:</b><br>
          1. จัดรูปสมการให้อยู่ในรูปแบบมาตรฐาน<br>
          2. ประยุกต์ใช้ทฤษฎีบทตามโครงสร้างพีชคณิต<br>
          <br><b>คำตอบ:</b> \\[ x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a} \\]
        `;
        renderSolution(mockResponse);
      }, 1000);

    } catch (err) {
      output.innerHTML = "เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์ประมวลผล";
    }
  } else {
    // การประมวลผลภายในเครื่องแบบพื้นฐาน
    let result = `<b>ผลการคำนวณเบื้องต้น:</b><br>ระบบ Local Engine รองรับเฉพาะสมการกฎพื้นฐาน หากต้องการแก้โจทย์ซับซ้อนโปรดเลือก AI Cloud Engine`;
    renderSolution(result);
  }
}

function renderSolution(htmlContent) {
  const output = document.getElementById("answer");
  output.className = "";
  output.innerHTML = htmlContent;
  
  // เรียก MathJax ให้แปลงสัญลักษณ์ LaTeX เป็นสูตรคณิตศาสตร์สวยงาม
  if (window.MathJax) {
    MathJax.typesetPromise([output]);
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").className = "loading";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>

</body>
</html>
