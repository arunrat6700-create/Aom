<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver — Step-by-Step Offline Engine</title>

<!-- MathJax Configuration -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Math.js Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<!-- Nerdamer Computer Algebra System (CAS) -->
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI', Tahoma, Arial, "Noto Sans Thai", sans-serif;background:#f0f4f9;color:#1e293b}
header{background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);color:#fff;padding:35px 5%;text-align:center;box-shadow:0 4px 20px #0002}
header h1{margin:0;font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:-0.5px}
header p{color:#94a3b8;margin-top:8px;font-size:15px}
.wrap{max-width:950px;margin:30px auto;padding:0 16px}
.panel{background:#fff;border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,0.05);margin-bottom:24px;border:1px solid #e2e8f0}
.panel-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.panel h2{margin:0;font-size:20px;color:#0f172a;display:flex;align-items:center;gap:8px}

/* แถบปุ่มนำทาง (Navigation Buttons) */
.nav-links{display:flex;gap:8px;flex-wrap:wrap}
.btn-nav{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;color:#475569;background:#f1f5f9;border:1px solid #cbd5e1;transition:all 0.2s}
.btn-nav:hover{background:#e2e8f0;color:#0f172a;transform:translateY(-1px)}

textarea{width:100%;min-height:140px;border:2px solid #cbd5e1;border-radius:14px;padding:16px;font-size:18px;resize:vertical;outline:none;transition:all 0.2s;font-family:inherit}
textarea:focus{border-color:#6366f1;box-shadow:0 0 0 4px #6366f11a}
.api-box{background:#f8fafc;border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin-bottom:16px}
.api-box input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #cbd5e1;font-size:14px;outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
button{padding:13px 24px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#4f46e5;color:#fff;box-shadow:0 4px 12px #4f46e540}
.btn-primary:hover{background:#4338ca;transform:translateY(-1px)}
.btn-clear{background:#f1f5f9;color:#475569}
.btn-clear:hover{background:#e2e8f0}

#answer{line-height:1.8;font-size:17px;background:#f8fafc;border-radius:14px;padding:22px;min-height:120px;border:1px solid #e2e8f0;word-break:break-word;white-space:pre-wrap}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:12px}
.badge-offline{background:#dcfce7;color:#166534}
.badge-ai{background:#e0e7ff;color:#3730a3}
.note{font-size:13px;color:#64748b;margin-top:10px}
.step-box{background:#fff;border:1px solid #cbd5e1;border-left:4px solid #4f46e5;padding:10px 14px;margin:6px 0;border-radius:6px;font-family:monospace}
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver Ultimate</h1>
  <p>ระบบแก้โจทย์คณิตศาสตร์ครอบคลุมทุกระดับ — ป.1-ป.6 • ม.1-ม.6 • มหาวิทยาลัย • IIT JEE</p>
</header>

<div class="wrap">
  <div class="panel">
    <!-- ส่วนหัวที่มีหัวข้อ + ปุ่มลิงก์ย้อนกลับ -->
    <div class="panel-header">
      <h2>📝 กรอกโจทย์คณิตศาสตร์</h2>
      <div class="nav-links">
        <a href="information.html" class="btn-nav">📋 ข้อมูลส่วนตัว</a>
        <a href="index.html" class="btn-nav">🏠 หน้าแรก</a>
      </div>
    </div>
    
    <div class="api-box">
      <label style="font-size:13px; font-weight:bold; color:#475569; display:block; margin-bottom:6px;">
        🔑 Gemini API Key (สำหรับโจทย์ประยุกต์ภาษาไทยยาวๆ หรือโจทย์ IIT):
      </label>
      <input type="password" id="apiKey" placeholder="วาง Gemini API Key ที่นี่ (ถ้าไม่มี ก็แก้โจทย์คิดเลข/สมการทั่วไปได้)" onchange="saveKey()">
    </div>

    <textarea id="problem" placeholder="พิมพ์โจทย์ได้ทุกรูปแบบ เช่น:
• คิดเลข/แสดงวิธีทำ: 2x4x4x8, 10+20*5, สองบวกสอง
• สมการพีชคณิต: x^2 - 5x + 6 = 0, 2x + 5 = 15
• แคลคูลัส: diff(x^3 + 2x, x), integrate(x^2, x)
• โจทย์ IIT/ประยุกต์ภาษาไทย: มีส้ม 5 ผล กินไป 2 ผล เหลือเท่าไหร่"></textarea>
    
    <div class="row">
      <button class="btn-primary" onclick="solve()">วิเคราะห์และแก้โจทย์</button>
      <button class="btn-clear" onclick="clearAll()">ล้างข้อมูล</button>
    </div>
    <p class="note">⚡ โจทย์คำนวณเบื้องต้น สมการ และแคลคูลัส สามารถคำนวณแบบ Offline ได้ทันทีโดยไม่ต้องรอกด API Key</p>
  </div>

  <div class="panel">
    <h2>💡 คำตอบและขั้นตอนการทำ</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
window.onload = function() {
  const savedKey = localStorage.getItem("gemini_math_key");
  if (savedKey) document.getElementById("apiKey").value = savedKey;
};

function saveKey() {
  const key = document.getElementById("apiKey").value.trim();
  localStorage.setItem("gemini_math_key", key);
}

// 1. ระบบแปลงภาษาพูดและสัญลักษณ์คูณ
function normalizeInput(input) {
  let str = input.trim();
  const thaiNumMap = {
    'ศูนย์': '0', 'หนึ่ง': '1', 'สอง': '2', 'สาม': '3', 'สี่': '4',
    'ห้า': '5', 'หก': '6', 'เจ็ด': '7', 'แปด': '8', 'เก้า': '9', 'สิบ': '10'
  };
  const thaiOpMap = {
    'บวก': '+', 'ลบ': '-', 'คูณ': '*', 'หาร': '/',
    'ยกกำลัง': '^', 'กำลัง': '^', 'เท่ากับ': '='
  };

  for (let key in thaiNumMap) str = str.split(key).join(thaiNumMap[key]);
  for (let key in thaiOpMap) str = str.split(key).join(thaiOpMap[key]);

  str = str.replace(/×/g, '*').replace(/÷/g, '/');
  
  // แปลง x ระหว่างตัวเลขเป็น *
  while (/(\d+)\s*[xX]\s*(\d+)/.test(str)) {
    str = str.replace(/(\d+)\s*[xX]\s*(\d+)/g, '$1*$2');
  }

  return str;
}

// 2. ฟังก์ชันจำลองวิธีทำทีละขั้นตอนสำหรับคิดเลขทั่วไป (Step Generator)
function generateStepByStep(expr) {
  let steps = [];
  let currentExpr = expr;

  try {
    let tokens = currentExpr.match(/(\d+\.?\d*|[\+\-\*\/\^\(\)])/g);
    if (!tokens) return null;

    // ถ้าเป็นการคูณล้วนๆ เช่น 2*4*4*8
    if (/^[\d\.\*]+$/.test(currentExpr)) {
      let nums = currentExpr.split('*').map(Number);
      let runningTotal = nums[0];

      for (let i = 1; i < nums.length; i++) {
        let prevTotal = runningTotal;
        runningTotal = runningTotal * nums[i];
        steps.push(`นำ ${prevTotal} คูณด้วย ${nums[i]} ได้เท่ากับ ${runningTotal}`);
      }
      return steps;
    }

    // ถ้ามีหลายเครื่องหมายผสมกัน
    let evalVal = math.evaluate(currentExpr);
    steps.push(`คำนวณตามลำดับความสำคัญของเครื่องหมาย (วงเล็บ -> ยกกำลัง -> คูณ/หาร -> บวก/ลบ)`);
    steps.push(`ผลลัพธ์สุทธิ = ${evalVal}`);
    return steps;

  } catch (e) {
    return null;
  }
}

async function solve() {
  const raw = document.getElementById("problem").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const out = document.getElementById("answer");

  if (!raw) {
    out.innerHTML = "<b style='color:#ef4444;'>กรุณากรอกโจทย์ก่อนครับ</b>";
    return;
  }

  const cleaned = normalizeInput(raw);

  // ==========================================
  // LAYER 1: INSTANT ARITHMETIC WITH STEP-BY-STEP
  // ==========================================
  try {
    const numResult = math.evaluate(cleaned);
    if (typeof numResult === 'number' || typeof numResult === 'boolean' || math.isBigNumber(numResult)) {
      
      let stepsText = "";
      const steps = generateStepByStep(cleaned);
      
      if (steps && steps.length > 0) {
        stepsText = `\n<b>📌 ขั้นตอนวิธีคิด:</b>\n`;
        steps.forEach((step, idx) => {
          stepsText += `  ขั้นที่ ${idx + 1}: ${step}\n`;
        });
      }

      out.innerHTML = `<span class="badge badge-offline">⚡ Offline Calculation with Steps</span>\n\n` +
                      `<b>โจทย์:</b> ${raw}\n` +
                      (cleaned !== raw ? `<b>นิพจน์คณิตศาสตร์:</b> <code>${cleaned}</code>\n` : '') +
                      stepsText +
                      `\n<b>สรุปคำตอบสุดท้าย:</b> <span style="font-size:26px; font-weight:bold; color:#4f46e5;">${numResult}</span>`;
      return;
    }
  } catch (e) {
    // ข้ามไป Layer ถัดไป
  }

  // ==========================================
  // LAYER 2: OFFLINE CAS (สมการ x^2-5x+6=0, 2x+5=15)
  // ==========================================
  if (cleaned.includes("=")) {
    try {
      const parts = cleaned.split("=");
      const expr = `(${parts[0]}) - (${parts[1]})`;
      const sol = nerdamer.solve(expr, 'x');
      const solText = sol.toString();
      if (solText && solText !== "[]") {
        out.innerHTML = `<span class="badge badge-offline">⚡ Offline Symbolic Algebra Engine</span>\n\n` +
                        `<b>สมการ:</b> $${parts[0]} = ${parts[1]}$\n\n` +
                        `<b>ขั้นตอนการหาค่า x:</b>\n` +
                        `1. จัดรูปสมการย้ายข้างให้อยู่ในรูป $(${parts[0]}) - (${parts[1]}) = 0$\n` +
                        `2. คำนวณหาค่ารากของสมการ\n\n` +
                        `<b>คำตอบ (Values of x):</b>\n$$x = ${nerdamer(sol).toTeX()}$$`;
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([out]);
        }
        return;
      }
    } catch (e) {}
  }

  // ==========================================
  // LAYER 3: UNIVERSAL AI ENGINE
  // ==========================================
  if (!apiKey) {
    out.innerHTML = `<b style="color:#f59e0b;">⚠️ โจทย์ประยุกต์/ภาษาไทยซับซ้อน</b>\n\n` +
                    `สำหรับโจทย์ประยุกต์ภาษาไทยยาวๆ หรือโจทย์ IIT โปรดนำ Gemini API Key มาใส่ที่ช่องด้านบนเพื่อเปิดใช้งาน AI Engine แสนฉลาดครับ\n` +
                    `(รับ API Key ฟรีได้ที่ Google AI Studio)`;
    return;
  }

  out.innerHTML = "⏳ กำลังวิเคราะห์โจทย์และแสดงวิธีทำระดับสถาบัน...";

  try {
    const promptText = `คุณคือผู้เชี่ยวชาญด้านคณิตศาสตร์ระดับโลก (IIT Level & Math Olympiad Coach) 
จงแก้โจทย์คณิตศาสตร์ต่อไปนี้:

โจทย์: "${raw}"

คำสั่งในการตอบ:
1. ระบุระดับชั้นของโจทย์
2. แสดงวิธีทำอย่างเป็นลำดับขั้นตอน ปิดท้ายด้วยสรุปคำตอบ
3. หากมีสูตรคณิตศาสตร์ ให้เขียนในรูปแบบ LaTeX Inline เช่น $x^2 + y^2 = r^2$ หรือ Display $$ \\int x dx $$
4. ตอบเป็นภาษาไทยอย่างชัดเจน สุภาพ`;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
    });

    const data = await response.json();
    if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
      let aiResponse = data.candidates[0].content.parts[0].text;
      out.innerHTML = `<span class="badge badge-ai">🧠 AI Universal Engine Result</span>\n\n` + aiResponse;

      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([out]).catch((err) => console.log('MathJax Error:', err));
      }
    } else {
      out.innerHTML = "<b style='color:#ef4444;'>เกิดข้อผิดพลาดในการประมวลผลจาก AI โปรดตรวจสอบ API Key อีกครั้ง</b>";
    }

  } catch (err) {
    out.innerHTML = `<b style='color:#ef4444;'>เกิดข้อผิดพลาดในการเชื่อมต่อ:</b> ${err.message}`;
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>

</body>
</html>
