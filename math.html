<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aom Math Solver — Universal Engine</title>

<!-- MathJax Configuration สำหรับรองรับสัญลักษณ์ $ ... $ และ \[ ... \] -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  svg: { fontCache: 'global' }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<!-- Math.js สำหรับคิดเลขเร็วแบบ Offline -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI', Tahoma, Arial, "Noto Sans Thai", sans-serif;background:#f0f4f9;color:#1e293b}
header{background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);color:#fff;padding:35px 5%;text-align:center;box-shadow:0 4px 20px #0002}
header h1{margin:0;font-size:clamp(26px,5vw,42px);font-weight:800;letter-spacing:-0.5px}
header p{color:#94a3b8;margin-top:8px;font-size:15px}
.wrap{max-width:950px;margin:30px auto;padding:0 16px}
.panel{background:#fff;border-radius:20px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,0.05);margin-bottom:24px;border:1px solid #e2e8f0}
.panel h2{margin-top:0;font-size:20px;color:#0f172a;display:flex;align-items:center;gap:8px}
textarea{width:100%;min-height:150px;border:2px solid #cbd5e1;border-radius:14px;padding:16px;font-size:17px;resize:vertical;outline:none;transition:all 0.2s;font-family:inherit}
textarea:focus{border-color:#6366f1;box-shadow:0 0 0 4px #6366f11a}
.api-box{background:#f8fafc;border:1px solid #e2e8f0;padding:14px;border-radius:12px;margin-bottom:16px}
.api-box input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid #cbd5e1;font-size:14px;outline:none}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
button{padding:13px 24px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-primary{background:#4f46e5;color:#fff;box-shadow:0 4px 12px #4f46e540}
.btn-primary:hover{background:#4338ca;transform:translateY(-1px)}
.btn-clear{background:#f1f5f9;color:#475569}
.btn-clear:hover{background:#e2e8f0}

/* ส่วนแสดงผลคำตอบ */
#answer{line-height:1.8;font-size:16.5px;background:#f8fafc;border-radius:14px;padding:22px;min-height:120px;border:1px solid #e2e8f0;word-break:break-word;white-space:pre-wrap}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin-bottom:12px}
.badge-offline{background:#dcfce7;color:#166534}
.badge-ai{background:#e0e7ff;color:#3730a3}
.note{font-size:13px;color:#64748b;margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>🧠 Aom Math Solver Universal</h1>
  <p>ระบบแก้โจทย์คณิตศาสตร์ครอบคลุมทุกระดับ — ป.1-ป.6 • ม.1-ม.6 • มหาวิทยาลัย • IIT JEE</p>
</header>

<div class="wrap">
  <div class="panel">
    <h2>📝 กรอกโจทย์คณิตศาสตร์</h2>
    
    <div class="api-box">
      <label style="font-size:13px; font-weight:bold; color:#475569; display:block; margin-bottom:6px;">
        🔑 Gemini API Key (ใส่สำหรับแก้โจทย์ประยุกต์/คำอธิบายยาวๆ/โจทย์ IIT):
      </label>
      <input type="password" id="apiKey" placeholder="วาง Gemini API Key ที่นี่" onchange="saveKey()">
    </div>

    <textarea id="problem" placeholder="พิมพ์โจทย์ได้ทุกรูปแบบ เช่น:
• คิดเลขเร็ว: 1+1, 2+2, 7+2, สองบวกสอง, 12x13, 100/5
• โจทย์ประถม-มัธยม: มีส้ม 5 ผล กินไป 2 ผล เหลือเท่าไหร่
• โจทย์มหาลัย/IIT: Solve x^2 - 5x + 6 = 0 หรือ Find derivative of x^3 * sin(x)"></textarea>
    
    <div class="row">
      <button class="btn-primary" onclick="solve()">วิเคราะห์และแก้โจทย์</button>
      <button class="btn-clear" onclick="clearAll()">ล้างข้อมูล</button>
    </div>
    <p class="note">💡 โจทย์ตัวเลขหรือภาษาไทยคิดเลขเร็ว ระบบจะตอบทันทีใน 0.01 วินาทีแบบ Offline</p>
  </div>

  <div class="panel">
    <h2>💡 คำตอบและขั้นตอนการทำ</h2>
    <div id="answer">รอรับโจทย์...</div>
  </div>
</div>

<script>
window.onload = function() {
  const savedKey = localStorage.getItem("gemini_math_key");
  if (savedKey) document.getElementById("apiKey").value = savedKey;
};

function saveKey() {
  const key = document.getElementById("apiKey").value.trim();
  localStorage.setItem("gemini_math_key", key);
}

function normalizeInput(input) {
  let str = input.trim();
  const textMap = {
    'บวก': '+', 'ลบ': '-', 'คูณ': '*', 'หาร': '/',
    'เท่ากับ': '=', 'ศูนย์': '0', 'หนึ่ง': '1', 'สอง': '2',
    'สาม': '3', 'สี่': '4', 'ห้า': '5', 'หก': '6',
    'เจ็ด': '7', 'แปด': '8', 'เก้า': '9', 'สิบ': '10'
  };

  for (let key in textMap) {
    str = str.split(key).join(textMap[key]);
  }
  str = str.replace(/×/g, '*').replace(/÷/g, '/');
  str = str.replace(/(\d+)\s*[xX]\s*(\d+)/g, '$1*$2');
  return str;
}

async function solve() {
  const raw = document.getElementById("problem").value.trim();
  const apiKey = document.getElementById("apiKey").value.trim();
  const out = document.getElementById("answer");

  if (!raw) {
    out.innerHTML = "<b style='color:#ef4444;'>กรุณากรอกโจทย์ก่อนครับ</b>";
    return;
  }

  const cleaned = normalizeInput(raw);

  // --- 1. INSTANT OFFLINE ENGINE (คิดเลขเร็ว 1+1, 2+2, 7+2, 12*13) ---
  try {
    const fastResult = math.evaluate(cleaned);
    if (typeof fastResult === 'number' || typeof fastResult === 'boolean') {
      out.innerHTML = `<span class="badge badge-offline">⚡ Instant Offline Calculation</span>\n<b>โจทย์:</b> ${raw}\n<b>คำตอบ:</b> <span style="font-size:24px; font-weight:bold; color:#4f46e5;">${fastResult}</span>`;
      return;
    }
  } catch (e) {
    // ข้ามไปใช้ AI Engine เมื่อเป็นโจทย์ประยุกต์
  }

  // --- 2. UNIVERSAL AI ENGINE ---
  if (!apiKey) {
    out.innerHTML = `<b style="color:#f59e0b;">⚠️ ไม่พบ Gemini API Key</b>\n\nโจทย์นี้เป็นโจทย์ประยุกต์/สมการซับซ้อน โปรดนำ Gemini API Key มาใส่ในช่องด้านบนเพื่อรับคำตอบพร้อมวิธีทำอย่างละเอียดครับ\n(รับ API Key ฟรีที่ Google AI Studio)`;
    return;
  }

  out.innerHTML = "⏳ กำลังวิเคราะห์โจทย์และคำนวณคำตอบอย่างละเอียด...";

  try {
    const promptText = `คุณคือผู้เชี่ยวชาญด้านคณิตศาสตร์ระดับโลก (IIT Level & Math Olympiad Coach) 
จงแก้โจทย์คณิตศาสตร์ต่อไปนี้:

โจทย์: "${raw}"

คำสั่งในการตอบ:
1. ระบุระดับชั้นของโจทย์ (เช่น ประถมศึกษา, มัธยมศึกษา, มหาวิทยาลัย, IIT Level)
2. แสดงวิธีทำอย่างเป็นลำดับขั้นตอน และสรุปคำตอบให้ชัดเจน
3. หากมีสูตรคณิตศาสตร์ ให้เขียนในรูปแบบ LaTeX Inline เช่น $x^2 + y^2 = r^2$ หรือ Display $$ \\int x dx $$
4. ตอบเป็นภาษาไทยอย่างชัดเจน สุภาพ`;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: promptText }] }]
      })
    });

    const data = await response.json();
    
    if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
      let aiResponse = data.candidates[0].content.parts[0].text;

      // จัดรูปแบข้อความให้อยู่ในสไตล์อ่านง่าย
      out.innerHTML = `<span class="badge badge-ai">🧠 AI Universal Engine Result</span>\n\n` + aiResponse;

      // บังคับให้ MathJax แสดงผลสัญลักษณ์คณิตศาสตร์หลังจากข้อความโหลดเสร็จ
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([out]).catch((err) => console.log('MathJax Error:', err));
      }
    } else {
      out.innerHTML = "<b style='color:#ef4444;'>เกิดข้อผิดพลาดในการประมวลผลจาก AI โปรดตรวจสอบ API Key อีกครั้ง</b>";
    }

  } catch (err) {
    out.innerHTML = `<b style='color:#ef4444;'>เกิดข้อผิดพลาดในการเชื่อมต่อ:</b> ${err.message}`;
  }
}

function clearAll() {
  document.getElementById("problem").value = "";
  document.getElementById("answer").innerHTML = "รอรับโจทย์...";
}
</script>

</body>
</html>
